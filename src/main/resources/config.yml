# AlkaFlair - tags cosmeticas + medalhas
# AlkaFlair NAO controla nametag/tablist/holograma diretamente - so expoe
# placeholders (ver hook/PlaceholderAPIHook) pro TAB/nChat consumirem, igual o
# resto do ecossistema (TAB ja e dono de tablist/nametag na rede).

tags:
  # Cooldown entre trocas de tag, em segundos (0 = sem cooldown)
  switch-cooldown-seconds: 3

  # Forca o jogador sempre ter alguma tag equipada (se false, permite desequipar)
  force-equipped: false

  # Titulo exibido ao trocar de tag
  title:
    enabled: true
    title: "<white><tag_display>"
    subtitle: "<gray>Tag selecionada"

  # Som ao trocar de tag (vazio = desabilita)
  sound: UI_TOAST_CHALLENGE_COMPLETE

# ============================================================
# TAG FLUTUANTE 3D (acima da cabeca do jogador - TextDisplay via packet, so
# visual, nao existe entidade real no mundo). Requer o plugin PacketEvents
# (softdepend) - sem ele, o recurso so fica desligado, sem erro. Texto exibido:
# prefixo resolvido da tag (mesmo texto de %alkaflair_tag_prefix%, respeitando
# ownPrefix/tagEnabled) + medalhas equipadas (mesma ordem de %alkaflair_medals%).
# ============================================================
floating-tag:
  enabled: true
  # Offset ADICIONAL (em blocos) por cima do ponto de montagem padrao do Minecraft
  # (que ja fica perto do topo da cabeca sozinho) - NAO e a altura absoluta. Precisa
  # calibrar vendo no jogo: sobe aos poucos (0.3, 0.5, 0.8...) ate ficar bom, rodando
  # "/tags reload" + desequipar/equipar a tag de novo pra ver o valor novo aplicado.
  offset-y: 0.4
  # Escala geral do texto/icone flutuante (1.0 = tamanho normal do font_image do
  # ItemsAdder). Sobe aos poucos (1.5, 2.0, 2.5...) ate ficar do tamanho que quiser -
  # nao precisa mexer no resource pack pra isso, e so um transform visual do plugin.
  scale: 1.0
  # Distancia (em blocos) alem da qual a tag nao e enviada a um jogador que acabou de entrar.
  view-distance: 48
  # Cor de fundo ARGB (8 digitos hex: AARRGGBB) atras do texto - controla a "caixinha"
  # atras, nao o texto/icone em si. 0 = totalmente transparente (padrao, sem caixinha).
  # Pra deixar mais escuro/claro atras, muda o alpha: 0x40000000 (~25% opaco, preto),
  # 0x80000000 (~50%), 0xFF000000 (100%, opaco de verdade). Pode usar outra cor no
  # lugar de 000000 tambem (RRGGBB).
  background-color: 0
  # Opacidade do TEXTO/ICONE em si (0-255, nao e o fundo acima) - 255 = normal/opaco,
  # valores menores deixam a tag flutuante mais transparente/apagada.
  text-opacity: 255
  # Largura maxima da linha antes de quebrar (bem alto pra nunca quebrar).
  line-width: 200
  # Ve a tag atraves de blocos/paredes.
  see-through: true
  # Separador entre o prefixo da tag e cada medalha equipada.
  separator: " "

medals:
  # Maximo padrao de medalhas equipadas simultaneamente (admin pode aumentar por jogador via /medals setslots)
  default-max-slots: 3

  # Ao desbloquear uma medalha via /medals add, tambem concede a permission no
  # LuckPerms (se presente), alem de salvar no banco - mantem os dois em sincronia
  # pra quem usa a permission em outro lugar (ex: outro plugin checando a mesma perm)
  grant-permission-on-unlock: true

# ============================================================
# CUSTO EM MOEDA (compra de tags via AlkaEconomy)
# ============================================================
economy:
  # Comandos de console executados apos uma compra bem-sucedida (alem de dar a tag)
  # Placeholders: %player%, %tag_id%, %tag_permission%
  purchase-commands: []

# ============================================================
# MENSAGENS
# ============================================================
messages:
  prefix: "<dark_gray>[<#00D9FF>AlkaFlair<dark_gray>] "
  reload: "<green>Configuracao recarregada."
  no-permission: "<red>Voce nao tem permissao."
  player-only: "<red>Este comando e apenas para jogadores."
  player-not-found: "<red>Jogador nao encontrado."
  usage: "<yellow>Uso: <white><usage>"

  tag-not-found: "<red>Tag '<white><id></white>' nao existe."
  tag-already-unlocked: "<red>Voce ja possui essa tag."
  tag-not-unlocked: "<red>Voce nao possui essa tag."
  tag-not-purchasable: "<red>Essa tag nao esta a venda."
  tag-not-enough-currency: "<red>Voce nao tem saldo suficiente."
  tag-purchase-success: "<green>Tag <white><tag_display> <green>comprada com sucesso!"
  tag-equipped: "<green>Tag equipada: <tag_display>"
  tag-unequipped: "<green>Tag removida."
  tag-cooldown: "<red>Aguarde <white><seconds>s <red>para trocar de tag novamente."
  tag-added: "<green>Tag <white><id> <green>adicionada para <white><player>."
  tag-removed: "<green>Tag <white><id> <green>removida de <white><player>."
  tag-own-set: "<green>Prefixo/sufixo proprio de <white><player> <green>definido."
  tag-own-invalid: "<red>Formato invalido - confira se toda tag MiniMessage esta fechada corretamente (ex: <white><gradient:#RRGGBB:#RRGGBB> <red>precisa das duas cores)."
  tag-own-cleared: "<green>Prefixo/sufixo proprio de <white><player> <green>limpo."
  tag-voucher-redeemed: "<green>Voce resgatou a tag <white><tag_display><green>!"
  tag-voucher-already-redeemed: "<red>Esse voucher ja foi resgatado."

  medal-not-found: "<red>Medalha '<white><id></white>' nao existe."
  medal-already-unlocked: "<red>Voce ja possui essa medalha."
  medal-not-unlocked: "<red>Voce nao possui essa medalha."
  medal-slots-full: "<red>Voce ja tem o maximo de medalhas equipadas (<white><max></white>)."
  medal-equipped: "<green>Medalha equipada: <medal_name>"
  medal-unequipped: "<green>Medalha removida."
  medal-added: "<green>Medalha <white><id> <green>adicionada para <white><player>."
  medal-removed: "<green>Medalha <white><id> <green>removida de <white><player>."
  medal-slots-set: "<green>Slots maximos de <white><player> <green>definidos para <white><amount>."
  medal-voucher-redeemed: "<green>Voce resgatou a medalha <white><medal_name><green>!"
  medal-voucher-already-redeemed: "<red>Esse voucher ja foi resgatado."
