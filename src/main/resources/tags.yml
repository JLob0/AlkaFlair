# Tags cosmeticas - equipaveis, uma por vez. NAO substitui o grupo do LuckPerms,
# so sobrepoe visualmente via placeholder (%alkaflair_tag_prefix%/%alkaflair_tag_suffix%).
#
# purchasable: true = aparece a venda no menu, cobra em economy.currency/amount
# obtainable: false = so admin pode dar via /tags add ou voucher (mesmo que purchasable seja false)
# permission (opcional): se definida, o jogador precisa ter ESSA permissao pra
#   contar como desbloqueada, alem (ou no lugar) de estar no /tags add - util pra
#   ligar uma tag a um rank/grupo do LuckPerms sem duplicar controle de acesso.

categories:
  # icon (opcional): material do item que representa a aba da categoria no menu
  # flair_tags (categoria-ativa/categoria-inativa em menus.yml). Se nao definido,
  # a aba cai no vidro generico (amarelo/cinza) do menus.yml.
  # itemsadder (opcional, "namespace:id"): glyph do ItemsAdder com prioridade sobre
  # o icon acima (padrao R9) - sem ItemsAdder ou id invalido, cai no icon/material.
  staff:
    display: "<gold>Equipe"
    position: 1
    icon: COMMAND_BLOCK
  lendarias:
    display: "<gradient:#FF0000:#FF8800>Lendárias"
    position: 2
    icon: DRAGON_HEAD
  vip:
    display: "<green>VIP"
    position: 3
    icon: DIAMOND
  shields:
    display: "<aqua>Escudos"
    position: 2
    icon: SHIELD
  default:
    display: "<gray>Padrão"
    position: 99
    icon: NAME_TAG
  teste:
    display: "<white>[TESTE] Trocar"
    position: 0
    icon: PAPER
  bounty:
    display: "<gradient:#FF3B30:#A855F7>Caçada</gradient>"
    position: 4
    icon: CROSSBOW

tags:
  dono:
    display: "<dark_red>Dono"
    prefix: "<dark_red>[Dono] "
    suffix: ""
    description:
      - "<gray>Tag destinada aos donos do servidor."
    # rarity/source sao opcionais, so pra hover/placeholder (%alkaflair_tag_rarity%,
    # %alkaflair_tag_source%) - vazio por padrao se nao setar.
    rarity: ""
    source: ""
    category: staff
    position: 1
    purchasable: false
    obtainable: false
    permission: "alkaflair.tag.dono"
    glow: true
    item:
      material: NETHER_STAR
      name: "<dark_red>Tag Dono"

  # ===== HIERARQUIA DA EQUIPE - todas category: staff, obtainable:false + permission
  # alkaflair.tag.<cargo>: desbloqueio via /tags add <player> <cargo> ou ligando a
  # permission a um grupo do LuckPerms por departamento. Cores agrupadas por
  # departamento (Fundação/Direção em vermelho-ouro, Gestão em ambar, Operação em
  # azul, Produto em verde, Tecnologia em ciano, Criativo em magenta, Comunidade &
  # Crescimento em rosa, Pessoas em cinza). =====

