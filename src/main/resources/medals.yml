# Medalhas cosmeticas - badges, multiplas equipaveis ao mesmo tempo (ate o limite
# de slots do jogador, ver config.yml medals.default-max-slots). Sem compra: so
# desbloqueiam por permissao (o jogador ja tem a permission em algum grupo) ou por
# /medals add / voucher fisico admin-dado.

medals:
  beta_tester:
    display: "<gold>β"
    name: "<gold>Testador Beta"
    description:
      - "<gray>Participou do beta do servidor."
    permission: "alkaflair.medal.beta_tester"
    rarity: "<white>Comum"
    # source e opcional, so pra hover/placeholder (%alkaflair_medal_<slot>_source%).
    source: ""
    # exclusive (opcional, default false): "SIM"/"Nao" no placeholder
    # %alkaflair_medal_<slot>_exclusive% - sinaliza que ninguem mais consegue essa
    # medalha hoje (evento passado, edicao limitada). So nas medalhas - nas tags o
    # campo `obtainable` ja cobre a mesma ideia.
    exclusive: false
    position: 1
    item:
      material: EXPERIENCE_BOTTLE
      name: "<gold>Medalha Beta"

  top_pvp:
    display: "<red>⚔"
    name: "<red>Top PvP"
    description:
      - "<gray>Ficou em 1º lugar no ranking de PvP."
    permission: "alkaflair.medal.top_pvp"
    rarity: "<aqua>Raro"
    position: 2
    item:
      material: DIAMOND_SWORD
      name: "<red>Medalha Top PvP"

  doador:
    display: "<light_purple>♛"
    name: "<light_purple>Doador"
    description:
      - "<gray>Apoiou o servidor com uma doação."
    permission: "alkaflair.medal.doador"
    rarity: "<light_purple>Épico"
    position: 3
    item:
      material: NETHERITE_INGOT
      name: "<light_purple>Medalha Doador"

  # ===== TESTE (21/08) - 6 medalhas so pra validar equipar/trocar varias ao mesmo
  # tempo (limite de slots). Dar via /medals add <id> <jogador>. Apagar apos o teste. =====
